<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KralHET | Bağlantılar</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
            padding: 20px;
        }

        /* Arka Plan Efektleri */
        .bg-glow {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.25) 0%, rgba(59, 130, 246, 0.15) 50%, rgba(0, 0, 0, 0) 70%);
            filter: blur(60px);
            z-index: 0;
            pointer-events: none;
        }

        .bg-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(rgba(255, 255, 255, 0.07) 1px, transparent 1px);
            background-size: 24px 24px;
            z-index: 0;
            pointer-events: none;
        }

        /* Ana Kart */
        .container {
            width: 100%;
            max-width: 480px;
            background: rgba(18, 24, 38, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            padding: 40px 24px 32px 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            z-index: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* Kullanıcı Adı ve Rozet */
        .username-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .username {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .name-verified-badge {
            background: #10b981;
            color: #0b0f19;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
        }

        .handle {
            color: #10b981;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            background: rgba(16, 185, 129, 0.1);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .bio {
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 28px;
            max-width: 360px;
        }

        /* Linkler */
        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 24px;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            text-decoration: none;
            color: #ffffff;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .link-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.05) 50%, rgba(255, 255, 255, 0) 100%);
            transform: translateX(-100%);
            transition: transform 0.6s ease;
        }

        .link-card:hover::before {
            transform: translateX(100%);
        }

        .link-card:hover {
            transform: translateY(-3px);
            background: rgba(30, 41, 59, 0.9);
            border-color: rgba(16, 185, 129, 0.4);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3), 0 0 15px rgba(16, 185, 129, 0.15);
        }

        .link-info {
            display: flex;
            align-items: center;
            gap: 16px;
            text-align: left;
        }

        .link-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .icon-mc {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .icon-yt {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .icon-sub {
            background: rgba(59, 130, 246, 0.15);
            color: #3b82f6;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .link-text {
            display: flex;
            flex-direction: column;
        }

        .link-title {
            font-weight: 700;
            font-size: 15px;
            line-height: 1.3;
            color: #f8fafc;
        }

        .link-badge {
            display: inline-block;
            font-size: 10px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 6px;
            margin-left: 6px;
            text-transform: uppercase;
            vertical-align: middle;
        }

        .badge-free {
            background: #10b981;
            color: #0b0f19;
        }

        .badge-sub {
            background: #ef4444;
            color: #ffffff;
        }

        .badge-new {
            background: #3b82f6;
            color: #ffffff;
        }

        .arrow-icon {
            color: #64748b;
            font-size: 14px;
            transition: transform 0.2s ease, color 0.2s ease;
        }

        .link-card:hover .arrow-icon {
            transform: translateX(4px);
            color: #ffffff;
        }

        /* Alt Bilgi */
        .footer {
            margin-top: 10px;
            font-size: 12px;
            color: #475569;
        }

        .footer strong {
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>
    <div class="bg-grid"></div>

    <div class="container">
        <!-- Kullanıcı Adı ve Yanındaki Onaylı Rozet -->
        <div class="username-container">
            <h1 class="username">KralHET</h1>
            <span class="name-verified-badge">
                <i class="fa-solid fa-check"></i>
            </span>
        </div>

        <div class="handle">@KralHET</div>
        <p class="bio"><i class="fa-solid fa-gamepad" style="margin-right: 6px; color: #10b981;"></i>Minecraft İçerik Üreticisi & Yazılımcı<br>Özel başarımlar, modlar ve eğlenceli Minecraft videoları!</p>

        <!-- Bağlantı Butonları -->
        <div class="links-container">
            
            <!-- 1. Seçenek: YouTube Kanalı -->
            <a href="https://www.youtube.com/@KralHET" target="_blank" class="link-card">
                <div class="link-info">
                    <div class="link-icon icon-yt">
                        <i class="fa-brands fa-youtube"></i>
                    </div>
                    <div class="link-text">
                        <span class="link-title">
                            YouTube Kanalıma Git!
                            <span class="link-badge badge-sub">ABONE OL</span>
                        </span>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right arrow-icon"></i>
            </a>

            <!-- 2. Seçenek: Abone Ol Al -->
            <a href="https://het642.github.io/abone-ol-al/" target="_blank" class="link-card">
                <div class="link-info">
                    <div class="link-icon icon-sub">
                        <i class="fa-solid fa-gift"></i>
                    </div>
                    <div class="link-text">
                        <span class="link-title">
                            Abone Ol Al
                            <span class="link-badge badge-new">ÖZEL</span>
                        </span>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right arrow-icon"></i>
            </a>

        </div>

        <!-- Alt Bilgi -->
        <div class="footer">
            © 2026 <strong>KralHET</strong>. Tüm hakları saklıdır.
        </div>
    </div>

</body>
</html>
